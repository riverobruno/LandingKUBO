        <path id="desk-right-leg-return" pathLength="1" d="M 1200 600 H 1180 V 340" />
      </g>
    </g>

    <g id="desk-apron">
      <path id="desk-apron-bottom" pathLength="1" d="M 420 415 H 980" />
    </g>

    <g id="desk-drawers">
      <path id="desk-drawer-divider" pathLength="1" d="M 980 340 V 510" />
      <path id="desk-upper-drawer-bottom" pathLength="1" d="M 980 420 H 1180" />
      <path id="desk-lower-drawer-bottom" pathLength="1" d="M 980 510 H 1180" />
    </g>
  </g>
</svg>
