schema: spec-driven
strict_tdd: true

context: |
  KUBO is an AI-powered web application that turns a furniture idea into a project ready for quotation and manufacturing. Product-facing UI and copy MUST be Spanish-only; OpenSpec technical artifacts MUST be written in English.
  The implemented repository contains a React frontend in Front/ and a NestJS demo backend in backend/, plus Docker Compose, Nginx, GitHub Actions, and SonarCloud configuration. Distinguish implemented behavior from planned system capabilities.
  The frontend uses React 19, TypeScript 6, Vite 8, Tailwind CSS 4, React Router, centralized routes, ClienteLayout, feature-oriented components, and native-fetch API modules.
  Front/rules.md is mandatory frontend guidance, including target authentication and API conventions; those conventions are not evidence that unimplemented auth or broader domain capabilities exist.
  The backend is a small NestJS modular application currently centered on DemoModule and demo endpoints. Do not infer backend, database, deployment, or infrastructure choices beyond repository evidence or an approved change.
  Verification currently combines backend node:test execution, frontend/backend TypeScript builds, and frontend ESLint; no coverage tool, formatter, frontend test runner, or E2E tool is configured.

testing:
  detected: 2026-09-10
  strict_tdd: true
  test_runner:
    backend:
      command: "cd backend && npm test"
      framework: "Node.js built-in test runner (node:test)"
      support: "Nest Testing and Supertest"
    frontend:
      command: null
      framework: null
  test_layers:
    unit:
      available: true
      tool: "node:test (backend capability)"
    integration:
      available: true
      tool: "Nest Testing + Supertest (backend)"
    e2e:
      available: false
      tool: null
  coverage:
    available: false
    command: null
  quality_tools:
    linter:
      frontend: "cd Front && npm run lint"
      backend: null
    type_checker:
      frontend: "cd Front && npm run build"
      backend: "cd backend && npm run build"
    formatter: null
  build:
    frontend: "cd Front && npm run build"
    backend: "cd backend && npm run build"

rules:
  proposal:
    - State the user or business outcome, scope, and explicit non-goals without inventing product requirements.
    - Identify whether each affected capability exists today or is planned, especially for backend and infrastructure work.
  specs:
    - Express requirements as observable behavior and include testable Given/When/Then scenarios for every requirement.
    - Keep product-facing behavior Spanish-only while writing the specification itself in English.
    - Do not prescribe implementation details unless they are project constraints or required for observable behavior.
  design:
    - Ground current-state claims in repository evidence and label unimplemented conventions or system areas as target state.
    - For frontend changes, follow Front/rules.md and explain any necessary deviation; do not invent backend or infrastructure technologies.
    - Address security boundaries when authentication, browser storage, cookies, API transport, or secrets are affected.
  tasks:
    - Organize tasks into small, dependency-ordered, verifiable implementation units with concrete file or area references.
    - Include cd Front && npm run build and cd Front && npm run lint when frontend files are affected.
    - Apply strict TDD where an applicable test runner exists; do not require automated frontend tests until a frontend test runner is introduced.
    - Do not add formatter steps while no formatter is configured.
  apply:
    guidelines:
      - Follow existing frontend and backend patterns and preserve the current repository state unless the approved change requires otherwise.
      - Do not recreate reverted post-SAST changes as part of unrelated work.
    tdd: true
    test_command: "cd backend && npm test"
  verify:
    test_command: "cd backend && npm test"
    build_command: "cd Front && npm run build && cd ../backend && npm run build"
    coverage_threshold: 0
  archive:
    - Preserve the change folder as an audit trail and warn before merging destructive deltas.
