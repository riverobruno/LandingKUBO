upstream frontend_nodes {
    # Round robin is the default. These passive failure thresholds remove a
    # failed replica temporarily and proxy_next_upstream tries the next one.
    server frontend-1:8080 max_fails=2 fail_timeout=5s;
    server frontend-2:8080 max_fails=2 fail_timeout=5s;
    server frontend-3:8080 max_fails=2 fail_timeout=5s;
}

upstream backend_nodes {
    # Round robin plus passive failover keeps /api/ available after a node dies.
    server backend-1:3000 max_fails=2 fail_timeout=5s;
    server backend-2:3000 max_fails=2 fail_timeout=5s;
    server backend-3:3000 max_fails=2 fail_timeout=5s;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    location ^~ /api/ {
        proxy_pass http://backend_nodes/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_pass_header X-Backend-Node;
    }

    location ^~ /stats/ {
        proxy_pass http://stats-aggregator:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://frontend_nodes;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }
}
